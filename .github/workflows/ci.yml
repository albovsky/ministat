name: Rust checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS validation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --check
      - name: Lint
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Build release
        run: cargo +1.99.1 build --locked --release
