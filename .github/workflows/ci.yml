name: Rust checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS validation
    # GitHub-hosted only: this repository is public, so untrusted PR code must
    # never reach a self-hosted machine.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce CI policy
        run: |
          ruby scripts/verify_ci_resource_policy.rb
          ruby scripts/ci_resource_policy_test.rb
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --check
      - name: Lint
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Verify administrator staging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build release
        run: cargo +1.99.1 build --locked --release
